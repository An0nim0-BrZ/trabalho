<!DOCTYPE html>
<html lang="en">
<head> 
    <link rel="stylesheet" href="css/login.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="conteudo">
        <div class="cont_esquerda">
            <div class="logo">
                logp
            </div>
            <div class="titulo"> 
                <h1>
                    Conectando talentos <br>a oportunidades reais.
                </h1>
            </div>
            <div class="texto">
                <span>
                    Estudantes, empresas e instituições no mesmo lugar.
                </span>
            </div>

        </div>
        <div class="cont_direita">
            <div class="cont_direita">
    <div class="conteudo_direita">
        
        <div class="titulo_direita">
            <h2>Bem-vindo de volta</h2>
            <p>Acesse seu painel de oportunidades.</p>
        </div>

        <div class="escolhas">
            <label class="opcao">
                <input type="radio" name="perfil" value="estudante" checked>
                <span>Estudante</span>
            </label>
            <label class="opcao">
                <input type="radio" name="perfil" value="empresa">
                <span>Empresa</span>
            </label>
            <label class="opcao">
                <input type="radio" name="perfil" value="instituicao">
                <span>Instituição</span>
            </label>
        </div>

        <form class="formulario" id="formLogin">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>

            <div class="botoes">
                <button type="submit" class="btn_entrar">Entrar no sistema</button>
                <a href="#" class="link_cadastro">Não tem conta? Cadastre-se</a>
            </div>
        </form>

    </div>
</div>
        </div>
    </div>  

  

</body>
</html>
